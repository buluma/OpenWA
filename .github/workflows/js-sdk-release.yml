name: JavaScript SDK Release

# Publishes @rmyndharis/openwa to npm from sdk/javascript.
#
# Bun publishes to the npm registry using the repository secret NPM_CONFIG_TOKEN. Bun does not yet
# support npm Trusted Publishing (OIDC) or provenance statements. Keep the token scoped to this
# package and limit its use to this isolated publish job.
#
# The SDK version is the package.json version on a dedicated tag (e.g. js-sdk-v0.2.0), NOT the
# monorepo v* app tags.

on:
  push:
    tags: ['js-sdk-v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Everything that installs or runs third-party code (the Bun install, the test toolchain, the compiler
  # that builds dist/) runs here, in a job that cannot mint a publish credential. Those packages resolve
  # from the lockfile today but are code from many authors, so they must never share a job with
  # id-token: write. Same layout as python-sdk-release.yml.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/javascript
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Guards are textual and secret-free, so a misconfigured release fails BEFORE anything is built
      # or published. Mirrors java-sdk-release.yml.
      - name: Guard — ref must be a js-sdk-v* release tag
        env:
          REF: ${{ github.ref }}
        run: |
          # workflow_dispatch can start this workflow on ANY ref; publishing an arbitrary branch or a
          # monorepo app tag to npm must not be possible.
          case "$REF" in
            refs/tags/js-sdk-v*) ;;
            *)
              echo "::error::This workflow publishes to npm and must run from a js-sdk-v* tag (got '$REF'). For workflow_dispatch, select the release tag as the run ref."
              exit 1
              ;;
          esac

      - name: Guard — tag version matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#js-sdk-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$REF_NAME' (version '$TAG_VERSION') does not match package.json version '$PKG_VERSION'. Bump the package or fix the tag before releasing."
            exit 1
          fi
          echo "Tag $REF_NAME matches package.json $PKG_VERSION"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # '22' resolves to the latest 22.x. No registry-url/NODE_AUTH_TOKEN: nothing here publishes.
          node-version: '22'
      # The audit ci.yml runs over this tree, so a tag cannot publish what main would refuse. `bun audit`
      # reads the lockfile alone, so it runs before the install executes any of the toolchain. It has no
      # skip path: an bun audit outage fails the publish, and a re-run clears it.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun audit --audit-level=high

      # --engine-strict: the tests below must not run on a Node the locked toolchain does not support.
      - run: bun install --frozen-lockfile

      # Same gates as SDK CI, and for the same reason Java's release runs its tests: the artifact that
      # reaches the registry must be the one that passed, not a rebuild nobody checked.
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - run: bun run smoke # packaging plus request smoke; must run after build

      # The tarball that passed the gates above is the one that ships: `bun pm pack` takes dist/ as built,
      # and the publish job uploads these bytes without a checkout or an install of its own.
      - name: Pack the package
        run: bun pm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: js-sdk-package
          path: sdk/javascript/*.tgz
          if-no-files-found: error

  publish:
    # Runs only after the guards, audit, tests and pack above all passed.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: js-sdk-package
          path: package/

      - name: Publish to the npm registry
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_CONFIG_TOKEN }}
        run: |
          bun publish "$GITHUB_WORKSPACE"/package/*.tgz --access public
